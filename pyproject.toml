[project]
name = "fongbe"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "syncXL", email = "xlegend1251@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "nemo-toolkit[all]",
    "text-unidecode>=1.3",
    "torchcodec>=0.17.0",
    "wget>=3.2",
]

[project.scripts]
fongbe = "fongbe:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
nemo-toolkit = { git = "https://github.com/NVIDIA-NeMo/Speech.git", rev = "main" }
